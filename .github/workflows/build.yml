name: build-iptv

on:
  schedule:
    - cron: "23 2 * * *"        # каждый день 02:23 UTC (~05:23 МСК)
  workflow_dispatch:             # ручной запуск: Actions -> build-iptv -> Run workflow
  push:
    paths: ["config/**", "scripts/**", ".github/workflows/build.yml"]

permissions:
  contents: write                # коммит state/health.json и снимков
  pages: write
  id-token: write

concurrency:
  group: iptv-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Сборка (плейлисты, проверка, EPG)
        run: python scripts/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Сохранить историю сбоев и снимки
        run: |
          git config user.name "iptv-bot"
          git config user.email "iptv-bot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "state: $(date -u +%F)" && for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done)
