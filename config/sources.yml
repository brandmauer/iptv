# ============================================================
#  ИСТОЧНИКИ. Порядок = приоритет (выше = главнее при дублях).
# ============================================================
publish:
  base_url: https://brandmauer.github.io/iptv   # откуда будут доступны результаты (GitHub Pages)

# Плейлисты теперь в config/playlists.yml (добавление/удаление - через workflow manage-sources).

# ---- телегид (XMLTV). Порядок = приоритет: канал берёт программу из первого
#      источника, где нашёлся И есть передачи. Недоступный источник пропускается. ----
epg:
  - {name: iptvx,        url: "https://iptvx.one/epg/epg.xml.gz"}
  - {name: epg-one-ru,   url: "http://epg.one/ru.xml.gz"}
  - {name: teleguide,    url: "http://www.teleguide.info/download/new3/xmltv.xml.gz"}
  - {name: ottepg,       url: "https://ottepg.ru/ottepg.xml.gz"}
  - {name: iptvx-tv,     url: "http://epg.iptvx.tv/xmltv.xml.gz"}
  - {name: epg-one-all,  url: "http://epg.one/epg.xml.gz"}
  # В твоём списке: http://programtv.ru/xmltv.xml.gz/626999101 - похоже на ссылку с лишним хвостом.
  # Если это личная ссылка - раскомментируй:
  # - {name: programtv, url: "http://programtv.ru/xmltv.xml.gz/626999101"}
