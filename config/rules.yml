# ============================================================
#  ПРАВИЛА. Все регулярки без учёта регистра.
# ============================================================
settings:
  min_total: 100            # если после чистки каналов меньше - сборка падает, прежняя публикация остаётся
  check:
    workers: 64
    timeout: 8
    hard_timeout: 20
    max_minutes: 90
    fail_threshold: 3       # канал удаляется после N проваленных запусков ПОДРЯД (если хоть раз работал)
    mass_fail_ratio: 0.6    # если у источника упало >60% - считаем проблемой сети/гео, провалы не засчитываются
    mass_fail_min: 20
  dead_groups:              # группа удаляется целиком, если недоступно больше ratio её каналов
    ratio: 0.9              # (недоступно = в blocked_channels.tsv ИЛИ провал проверки)
    min_channels: 3
  quality:
    prefer_hd: true         # если есть HD-версия канала - обычные (SD) версии удаляются
  dupes:
    file: dupes.m3u         # лишние версии одного канала (после выбора основной) - сюда
    max_per_channel: 3
  epg:
    days_ahead: 7
    hours_back: 6
    fuzzy: 0.92

# ---------- ЧТО УДАЛЯТЬ ----------
# Список групп для удаления по точному названию: config/delete_groups.txt (там же /регэксп/).
exclude:
  keep_names: []            # регэкспы имён, которые оставить, даже если попали под маски
  tokens: true              # удалять ссылки с токенами/ключами/подписью/логином (быстро протухают)
  group:                    # по группе (исходной или итоговой)
    - "спорт|sport"
    - 'kids|children|детск|animation|мульт'      # детские
    - 'regional|регион'                          # региональные
    - 'relig|религ|православ|ислам'              # религиозные
    - 'shop|магазин'                             # магазины
    - 'fashion|мода'                             # мода
    - '\b(4k|uhd)\b'                             # 4K
    - '\bvpn\b'                                  # группы "(VPN)": нужен VPN/иностранный IP
  name:                     # по названию канала
    # спорт
    - '\bsports?\b|sport ?\d|\bспорт'
    - 'матч|match ?tv|eurosport|евроспорт|setanta|сетанта|arena ?sport|football|футбол|хоккей|hockey|бокс|boxing|\bufc\b|\bmma\b|\bкхл\b|\bkhl\b|формула|formula|\bwwe\b|\bf1\b|\bnba\b|\bnfl\b'
    # 4K
    - '\b4k\b|\buhd\b|2160'
    # часовые пояса: "+1", "+2", "(+4)", "МСК+2", "UTC+3"
    - '(?:^|[\s(\[\-])\+ ?\d{1,2}(?!\d)'
    - '(мск|msk|utc|gmt) ?[+\-] ?\d'
    # детские
    - 'детск|\bkids?\b|\bbaby\b|малыш|мульт|cartoon|nickelodeon|\bnick ?jr|disney|карусель|бумеранг|boomerang|мамонтен|gulli|tiji|пингвин'
    # региональные
    - '\bгтрк\b|регион'
    # мода
    - '\bfashion\b|fashion ?tv|\bftv\b|\bмода\b'
    # религиозные
    - 'религ|православ|\bспас\b|ислам|islam|quran|коран|\bbible\b|библи|church|церков|catholic|christian|jesus|иисус|ewtn|3abn'
    # магазины
    - '\bshop|магазин|\bqvc\b|\bhsn\b|ювелир|jewel'
  url:                      # по ссылке потока
    - 'vgtrkregion'

# ---------- ГРУППЫ ----------
radio:
  group: Радио
  detect_group: "радио|radio"
  detect_url: '\.(mp3|aac|ogg|opus)(\?|$)'
groups:
  unmapped: keep            # keep = оставить исходную группу, default = "Разное"
  default: Разное
  rules:
    - {name: "^(первый канал|россия|нтв|пятый канал|5 канал|рен тв|ren tv|стс|тнт|домашний|тв-?3|пятница|звезда|мир|отр|тв ?центр|твц|муз-?тв|че$|ю$|рбк)", to: Федеральные}
    - {group: "news|новост|информ", to: Новости}
    - {group: "music|музык", to: Музыка}
    - {group: "movie|film|кино|фильм|series|сериал", to: Фильмы}
    - {group: "documentary|познават|science|education|образов|history|истор", to: Познавательные}
    - {group: "entertainment|развлек|comedy|general|общ", to: Общие}
    - {group: "travel|outdoor|cooking|lifestyle|life|хобби|путешеств", to: Хобби}
    - {group: "^(undefined|other|unknown)$", to: Разное}
  order: [Федеральные, Общие, Новости, Фильмы, Познавательные, Музыка, Хобби, Зарубежные, Rutube, Камеры, Радио, Разное]

# ---------- РУЧНОЕ СОПОСТАВЛЕНИЕ С ТЕЛЕГИДОМ ----------
# "имя канала в плейлисте": "имя канала в EPG"  или  "id:xmltv-id"
aliases: {}
#  "Россия 1 HD": "Россия 1"
#  "Первый": "id:Pervyj.ru"

# ---------- ВЫХОДНЫЕ ФАЙЛЫ ----------
outputs:
  - {file: ru.m3u,      exclude_groups: [Радио, Камеры], epg: full}
  - {file: ru-lite.m3u, exclude_groups: [Радио, Камеры], epg: lite}   # для слабых ТВ-приставок
  - {file: radio.m3u,   include_groups: [Радио], epg: none}
  - {file: all.m3u,     epg: full}
