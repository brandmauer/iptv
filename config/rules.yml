# ============================================================
#  ПРАВИЛА. Все регулярки без учёта регистра.
# ============================================================
settings:
  min_total: 100            # если после чистки каналов меньше - сборка падает, прежняя публикация остаётся
  max_variants: 2           # сколько дублей одного канала (из разных источников) оставлять: основной + запасной
  check:
    workers: 64
    timeout: 8              # сек на соединение
    hard_timeout: 20        # жёсткий лимит на одну ссылку
    max_minutes: 90         # общий лимит проверки; непроверенное остаётся как есть
    fail_threshold: 3       # канал удаляется после N проваленных запусков ПОДРЯД (если хоть раз работал)
    mass_fail_ratio: 0.6    # если у источника упало >60% - считаем проблемой сети/гео и провалы НЕ засчитываем
    mass_fail_min: 20
  epg:
    days_ahead: 7
    hours_back: 6
    fuzzy: 0.92             # 0 = выключить нечёткое сопоставление имён

# ---------- ЧТО УДАЛЯТЬ ----------
exclude:
  keep_names: []            # регэкспы имён, которые оставить, даже если попали под маски ниже
  group:                    # по группе (исходной или итоговой)
    - "спорт|sport"
  name:                     # по названию канала
    - '\bsports?\b|sport ?\d|\bспорт'
    - 'матч|match ?tv|eurosport|евроспорт|setanta|сетанта|arena ?sport|football|футбол|хоккей|hockey|бокс|boxing|\bufc\b|\bmma\b|\bкхл\b|\bkhl\b|формула|formula|\bwwe\b|\bf1\b|\bnba\b|\bnfl\b'
  url: []                   # по ссылке потока, напр. 'badhost\.com'

# ---------- ГРУППЫ ----------
radio:
  group: Радио
  detect_group: "радио|radio"
  detect_url: '\.(mp3|aac|ogg|opus)(\?|$)'
groups:
  unmapped: keep            # keep = оставить исходную группу, default = "Разное"
  default: Разное
  # первое совпавшее правило побеждает; group - по исходной группе, name - по названию (нужны оба, если указаны оба)
  rules:
    - {name: "^(первый канал|россия|нтв|пятый канал|5 канал|рен тв|ren tv|стс|тнт|домашний|тв-?3|пятница|звезда|мир|отр|карусель|тв ?центр|твц|муз-?тв|че$|ю$|рбк)", to: Федеральные}
    - {group: "news|новост|информ", to: Новости}
    - {group: "kids|children|детск|animation|мульт", to: Детские}
    - {group: "music|музык", to: Музыка}
    - {group: "movie|film|кино|фильм|series|сериал", to: Фильмы}
    - {group: "documentary|познават|science|education|образов|history|истор", to: Познавательные}
    - {group: "entertainment|развлек|comedy|general|общ", to: Общие}
    - {group: "regional|регион|local|област", to: Региональные}
    - {group: "religious|религ", to: Религия}
    - {group: "travel|outdoor|cooking|lifestyle|life|хобби|путешеств", to: Хобби}
    - {group: "^(undefined|other|unknown)$", to: Разное}
  order: [Федеральные, Общие, Новости, Фильмы, Познавательные, Детские, Музыка, Региональные, Хобби, Религия, Зарубежные, Rutube, Камеры, Радио, Разное]

# ---------- РУЧНОЕ СОПОСТАВЛЕНИЕ С ТЕЛЕГИДОМ ----------
# "имя канала в плейлисте": "имя канала в EPG"  или  "id:xmltv-id"
# Каналы без программы см. в опубликованном unmatched_epg.txt
aliases: {}
#  "Россия 1 HD": "Россия 1"
#  "Первый": "id:Pervyj.ru"

# ---------- ВЫХОДНЫЕ ФАЙЛЫ ----------
outputs:
  - {file: ru.m3u,      exclude_groups: [Радио, Камеры], epg: full}
  - {file: ru-lite.m3u, exclude_groups: [Радио, Камеры], epg: lite}   # для слабых ТВ-приставок
  - {file: radio.m3u,   include_groups: [Радио], epg: none}
  - {file: all.m3u,     epg: full}
